name: Build F2Media fnOS x86

on:
  workflow_dispatch:
    inputs:
      version:
        description: "F2Media 版本（X.Y.Z）"
        required: true
        default: "0.5.3"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    env:
      VERSION: ${{ inputs.version }}
      FNPACK_VERSION: "1.2.3"
      FNPACK_LINUX_AMD64_SHA256: "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93"
      XCLI_VERSION: "v0.5.0"
      SHORT_VIDEOS_COMMIT: "87a7901018f9708663568d762e59a442a40c77c5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Prepare version and diagnostics
        run: |
          set -euo pipefail
          mkdir -p build-logs build/tools build/vendor
          # GitHub Web 上传/ZIP 解压可能丢失 executable bit；在 CI 内统一恢复。
          chmod +x scripts/*.sh fnos/start-f2media fnos/cmd/*
          python scripts/set_version.py "$VERSION" | tee build-logs/version.log
          {
            date -u +%Y-%m-%dT%H:%M:%SZ
            uname -a
            python --version
            ldd --version 2>&1 | sed -n '1p' || true
          } | tee build-logs/environment.log

      - name: Fetch douyin_parse v2.0.3 core
        run: |
          set -euo pipefail
          rm -rf build/vendor/douyin_parse
          git clone --depth 1 --branch v2.0.3 https://github.com/DLWangSan/douyin_parse.git build/vendor/douyin_parse
          test -f build/vendor/douyin_parse/douyin_video_parser.py
          test -f build/vendor/douyin_parse/abogus.py
          test -f build/vendor/douyin_parse/xbogus.py
          git -C build/vendor/douyin_parse rev-parse HEAD | tee build-logs/douyin-parse-commit.txt

      - name: Fetch x-cli source
        run: |
          set -euo pipefail
          rm -rf build/vendor/x-cli
          git clone --depth 1 --branch "$XCLI_VERSION" --recurse-submodules https://github.com/tamnd/x-cli.git build/vendor/x-cli
          git -C build/vendor/x-cli rev-parse HEAD | tee build-logs/x-cli-commit.txt

      - name: Verify short_videos source pin
        run: |
          set -euo pipefail
          rm -rf build/vendor/short_videos
          git clone --filter=blob:none https://github.com/jiuhunwl/short_videos.git build/vendor/short_videos
          git -C build/vendor/short_videos fetch --depth 1 origin "$SHORT_VIDEOS_COMMIT"
          git -C build/vendor/short_videos checkout --detach "$SHORT_VIDEOS_COMMIT"
          git -C build/vendor/short_videos rev-parse HEAD | tee build-logs/short-videos-commit.txt
          test "$(git -C build/vendor/short_videos rev-parse HEAD)" = "$SHORT_VIDEOS_COMMIT"
          for f in DouyinParser.php KuaishouSpider.php XiaohongshuParser.php BilibiliParser.php; do
            test -f "build/vendor/short_videos/api/$(case "$f" in DouyinParser.php) echo douyin;; KuaishouSpider.php) echo kuaishou;; XiaohongshuParser.php) echo xiaohongshu;; BilibiliParser.php) echo bilibili;; esac)/$f"
          done

      - name: Install build dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install --no-deps .
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          from fastapi import APIRouter, FastAPI
          from fastapi_mcp import FastApiMCP
          assert version("fastapi-mcp") == "0.4.0"
          assert version("mcp") == "1.12.1"
          app = FastAPI()
          @app.get('/probe', operation_id='mcp_probe')
          def probe(): return {'ok': True}
          m = FastApiMCP(app, name='probe', description='probe', include_operations=['mcp_probe'])
          router = APIRouter()
          m.mount_http(router=router, mount_path='/mcp')
          assert any(getattr(r, 'path', None) == '/mcp' for r in router.routes)
          print('FastApiMCP compatibility probe OK')
          PY
          python -m pip freeze > build-logs/pip-freeze.txt

      - name: Unit tests and repository self-check
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m compileall -q f2media scripts
          python scripts/selfcheck.py
          bash -n scripts/build_fpk.sh
          for f in fnos/cmd/* fnos/start-f2media; do bash -n "$f"; done

      - name: Install verified official fnpack 1.2.3
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64" \
            --output build/tools/fnpack
          printf '%s  %s\n' "$FNPACK_LINUX_AMD64_SHA256" "build/tools/fnpack" | sha256sum --check
          chmod 755 build/tools/fnpack
          build/tools/fnpack --help | tee build-logs/fnpack-toolchain.log

      - name: Build F2Media runtime and gallery-dl
        run: |
          set -euo pipefail
          rm -rf build/runtime build/engines dist
          mkdir -p build/runtime build/engines build/bin
          pyinstaller --noconfirm --clean --onedir --name f2media-runtime \
            --paths build/vendor/douyin_parse \
            --add-data "f2media/static:f2media/static" \
            --collect-all uvicorn --collect-all cryptography \
            --collect-all fastapi_mcp --collect-all mcp \
            --collect-all PIL --collect-all gmssl \
            --hidden-import douyin_video_parser --hidden-import abogus --hidden-import xbogus \
            --copy-metadata fastapi-mcp --copy-metadata mcp \
            scripts/runtime_entry.py
          mv dist/f2media-runtime build/runtime/
          rm -rf dist
          pyinstaller --noconfirm --clean --onedir --name gallery-dl \
            --collect-all gallery_dl --copy-metadata gallery-dl \
            scripts/engine_gallerydl_entry.py
          mv dist/gallery-dl build/engines/

      - name: Build short_videos PHP engine
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y php8.1-cli php8.1-curl
          PHP_BIN="$(command -v php8.1 || command -v php)"
          php -m | tee build-logs/php-modules.txt
          php -r 'if (!function_exists("curl_init")) { fwrite(STDERR, "PHP cURL extension missing\n"); exit(1); }'
          python scripts/package_php_runtime.py "$PHP_BIN" build/php
          build/php/bin/php -n -v | tee build-logs/php-runtime-version.txt
          build/php/bin/php -n \
            -d extension_dir="$PWD/build/php/extensions" \
            -d extension=curl.so \
            -r 'if (!function_exists("curl_init")) { fwrite(STDERR, "packaged PHP cURL extension missing\n"); exit(1); } echo PHP_VERSION, " packaged cURL OK\n";'
          rm -rf build/short-videos
          mkdir -p build/short-videos
          cp f2media/parsers/short_videos_vendor/{adapter.php,DouyinParser.php,KuaishouSpider.php,XiaohongshuParser.php,BilibiliParser.php} build/short-videos/
          cp f2media/parsers/short_videos_vendor/short_videos build/bin/short_videos
          chmod +x build/bin/short_videos
          for file in build/short-videos/*.php; do
            build/php/bin/php -n -d extension_dir="$PWD/build/php/extensions" -d extension=curl.so -l "$file"
          done
          F2MEDIA_SHORT_VIDEOS_BIN="$PWD/build/bin/short_videos" \
            F2MEDIA_SHORT_VIDEOS_ADAPTER="$PWD/build/short-videos/adapter.php" \
            F2MEDIA_SHORT_VIDEOS_PHP="$PWD/build/php/bin/php" \
            F2MEDIA_SHORT_VIDEOS_EXT_DIR="$PWD/build/php/extensions" \
            F2MEDIA_SHORT_VIDEOS_LIB_DIR="$PWD/build/php/lib" \
            build/bin/short_videos --health | tee build-logs/short-videos-health.json
          set +e
          printf '%s\n' '{"platform":"invalid","url":"https://example.invalid/","cookie":""}' | build/bin/short_videos > build-logs/short-videos-stdin-check.json
          rc=$?
          set -e
          test "$rc" = 2
          grep -q '不支持平台' build-logs/short-videos-stdin-check.json
          cmp f2media/parsers/short_videos_vendor/DouyinParser.php build/vendor/short_videos/api/douyin/DouyinParser.php
          cmp f2media/parsers/short_videos_vendor/KuaishouSpider.php build/vendor/short_videos/api/kuaishou/KuaishouSpider.php
          cmp f2media/parsers/short_videos_vendor/XiaohongshuParser.php build/vendor/short_videos/api/xiaohongshu/XiaohongshuParser.php
          cmp f2media/parsers/short_videos_vendor/BilibiliParser.php build/vendor/short_videos/api/bilibili/BilibiliParser.php

      - name: Build x-cli
        run: |
          set -euo pipefail
          mkdir -p build/bin
          XCLI_SEMVER="${XCLI_VERSION#v}"
          XCLI_COMMIT="$(git -C build/vendor/x-cli rev-parse --short HEAD)"
          XCLI_DATE="$(git -C build/vendor/x-cli show -s --format=%cI HEAD)"
          (cd build/vendor/x-cli && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/tamnd/x-cli/cli.Version=${XCLI_SEMVER} -X github.com/tamnd/x-cli/cli.Commit=${XCLI_COMMIT} -X github.com/tamnd/x-cli/cli.Date=${XCLI_DATE}" \
            -o "$GITHUB_WORKSPACE/build/bin/x-cli" ./cmd/x)
          chmod +x build/bin/x-cli
          (build/bin/x-cli version || build/bin/x-cli --version) | tee build-logs/x-cli-version.txt

      - name: Download external binaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/download_github_asset.py yt-dlp/yt-dlp-nightly-builds latest yt-dlp_linux build/bin/yt-dlp
          chmod +x build/bin/yt-dlp
          python scripts/download_github_asset.py denoland/deno v2.9.5 deno-x86_64-unknown-linux-gnu.zip /tmp/deno.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/deno.zip') as z: z.extract('deno', 'build/bin')
          PY
          chmod +x build/bin/deno
          python scripts/download_github_asset.py yt-dlp/FFmpeg-Builds latest ffmpeg-master-latest-linux64-gpl.tar.xz /tmp/ffmpeg.tar.xz
          rm -rf /tmp/ffmpeg-extract && mkdir -p /tmp/ffmpeg-extract
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract
          ROOT="$(find /tmp/ffmpeg-extract -mindepth 1 -maxdepth 1 -type d -print -quit)"
          install -m755 "$ROOT/bin/ffmpeg" build/bin/ffmpeg
          install -m755 "$ROOT/bin/ffprobe" build/bin/ffprobe

      - name: fnOS Debian 12 glibc compatibility gate
        run: |
          set -euo pipefail
          python scripts/check_glibc.py --max 2.36 \
            build/runtime/f2media-runtime build/engines/gallery-dl \
            build/bin/yt-dlp build/bin/deno build/bin/ffmpeg build/bin/ffprobe \
            build/bin/x-cli \
            build/bin/short_videos build/php/bin/php build/php/extensions/curl.so \
            2>&1 | tee build-logs/glibc.log

      - name: Runtime API/MCP self-check
        run: |
          set -euo pipefail
          TMPROOT="$(mktemp -d)"
          F2MEDIA_DATA_DIR="$TMPROOT/data" \
          F2MEDIA_DOWNLOAD_DIR="$TMPROOT/downloads" \
          F2MEDIA_GALLERYDL_BIN="$PWD/build/engines/gallery-dl/gallery-dl" \
          F2MEDIA_YTDLP_BIN="$PWD/build/bin/yt-dlp" \
          F2MEDIA_DENO_BIN="$PWD/build/bin/deno" \
          F2MEDIA_XCLI_BIN="$PWD/build/bin/x-cli" \
          F2MEDIA_SHORT_VIDEOS_BIN="$PWD/build/bin/short_videos" \
          F2MEDIA_SHORT_VIDEOS_ADAPTER="$PWD/build/short-videos/adapter.php" \
          F2MEDIA_SHORT_VIDEOS_PHP="$PWD/build/php/bin/php" \
          F2MEDIA_SHORT_VIDEOS_EXT_DIR="$PWD/build/php/extensions" \
          F2MEDIA_SHORT_VIDEOS_LIB_DIR="$PWD/build/php/lib" \
          F2MEDIA_FFMPEG_DIR="$PWD/build/bin" \
          F2MEDIA_API_KEY="ci-test-api-key" F2MEDIA_PORT=18083 \
            build/runtime/f2media-runtime/f2media-runtime >"$TMPROOT/runtime.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:18083/api/health > "$TMPROOT/health.json" && break
            sleep 0.5
          done
          python - "$TMPROOT/health.json" "$VERSION" <<'PY'
          import json, sys
          obj=json.load(open(sys.argv[1]))
          assert obj['ok'] is True and obj['version']==sys.argv[2]
          assert obj['mcp_enabled'] is True and obj['mcp_path']=='/mcp'
          PY
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18083/api/v1/tasks/nope || true)
          test "$code" = 401
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'X-API-Key: ci-test-api-key' http://127.0.0.1:18083/api/v1/tasks/nope || true)
          test "$code" = 404
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          trap - EXIT
          cat "$TMPROOT/runtime.log" | tee build-logs/runtime.log

      - name: Build fnOS FPK
        env:
          FNPACK_BIN: ${{ github.workspace }}/build/tools/fnpack
        run: |
          set -euo pipefail
          bash scripts/build_fpk.sh "$VERSION" "$FNPACK_BIN" | tee build-logs/fpk-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F2Media-${{ inputs.version }}-build-logs
          path: build-logs
          if-no-files-found: warn

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: F2Media-${{ inputs.version }}-fnOS-x86
          path: |
            dist/*.fpk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" dist/*.fpk dist/SHA256SUMS.txt \
            --title "F2Media v$VERSION" \
            --notes "F2Media v$VERSION：九平台解析/下载架构重构；抖音优先 douyin_parse；douyin_parse + 可编辑免费 API + gallery-dl + yt-dlp；支持 REST/MCP、Cookie、日期/平台/标题目录、Live Photo 成对下载、任务管理，以及 平台解析路由可视化排序；保留 x-cli；gallery-dl/yt-dlp/x-cli 支持 WebUI 在线更新与一键回滚。"
