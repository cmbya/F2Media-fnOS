name: Apply F2Media v0.2.3 Facebook Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install -e .

      - name: Apply Facebook v0.2.3 source fix
        run: |
          set -euo pipefail
          python scripts/apply_v023_facebook_fix.py
          python scripts/set_version.py 0.2.3

      - name: Static and unit checks
        run: |
          set -euo pipefail
          python -m compileall -q f2media scripts tests
          pytest -q
          bash -n scripts/build_fpk.sh
          bash -n scripts/build_install_probe.sh
          bash -n fnos/start-f2media
          for f in fnos/cmd/*; do [ -f "$f" ] && bash -n "$f"; done

      - name: Verify Facebook fix contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from f2media.parsers.facebook_resolver import facebook_cli_target, facebook_cookie_credentials, normalize_known_facebook_url

          assert facebook_cli_target("https://www.facebook.com/reel/2300217217408960") == ("reel", "2300217217408960")
          assert normalize_known_facebook_url(
              "https://www.facebook.com/groups/851882484849213?multi_permalinks=28938059365804815"
          ) == "https://www.facebook.com/groups/851882484849213/posts/28938059365804815/"
          ns = "# Netscape HTTP Cookie File\n.facebook.com\tTRUE\t/\tTRUE\t0\tc_user\t123\n.facebook.com\tTRUE\t/\tTRUE\t0\txs\tabc\n"
          assert facebook_cookie_credentials(ns) == ("123", "abc")
          text = Path("f2media/parse_service.py").read_text(encoding="utf-8")
          assert '"auth", "import", "--c-user", c_user, "--xs", xs' in text
          assert 'command, target = facebook_cli_target(item.url)' in text
          print("Facebook v0.2.3 contract checks OK")
          PY

      - name: Prepare changed-files artifact
        run: |
          set -euo pipefail
          rm -rf build/v023-facebook-fix
          mkdir -p build/v023-facebook-fix
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/apply-v023-facebook-fix.yml|scripts/apply_v023_facebook_fix.py) continue ;;
            esac
            [ -f "$f" ] || continue
            mkdir -p "build/v023-facebook-fix/$(dirname "$f")"
            cp "$f" "build/v023-facebook-fix/$f"
          done < <(git diff --name-only)
          (cd build/v023-facebook-fix && zip -qr ../F2Media-v0.2.3-facebook-fix-files.zip .)
          unzip -t build/F2Media-v0.2.3-facebook-fix-files.zip

      - name: Upload changed-files artifact
        uses: actions/upload-artifact@v4
        with:
          name: F2Media-v0.2.3-facebook-fix-files
          path: build/F2Media-v0.2.3-facebook-fix-files.zip
          if-no-files-found: error

      - name: Remove temporary patch helpers
        run: |
          rm -f .github/workflows/apply-v023-facebook-fix.yml scripts/apply_v023_facebook_fix.py

      - name: Commit fix back to repository
        id: push
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix: Facebook Reel, group session and share resolver (v0.2.3)"
          git push

      - name: Push result
        run: |
          if [ "${{ steps.push.outcome }}" = "success" ]; then
            echo "Fix committed and pushed. Run the normal F2Media build workflow with version 0.2.3."
          else
            echo "Automatic push failed. Download the changed-files artifact from this run and upload those files manually."
            exit 1
          fi
