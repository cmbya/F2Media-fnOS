[build-system]
requires = ["setuptools>=77,<85", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "f2media-fnos"
version = "0.2.0"
description = "fnOS multi-platform media parser and NAS downloader"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "cryptography>=43,<47",
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "requests>=2.32,<3",
  "gmssl>=3.2,<4",
  "fastapi-mcp==0.4.0",
  "mcp==1.12.1",
]

[project.optional-dependencies]
engines = [
  "gallery-dl==1.32.9",
]
dev = ["pytest>=8,<10", "ruff>=0.8"]

[project.scripts]
f2media = "f2media.main:run"

# Explicitly package only the application. fnos/, scripts/ and tests/ are
# repository/build assets and must never be auto-discovered as Python packages.
[tool.setuptools.packages.find]
where = ["."]
include = ["f2media", "f2media.*"]
exclude = ["fnos*", "scripts*", "tests*"]
namespaces = false

[tool.setuptools.package-data]
f2media = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
