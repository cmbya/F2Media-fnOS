<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F2Media 初始化</title><style>body{font-family:system-ui;background:#0e1116;color:#eee;margin:0}.box{max-width:520px;margin:10vh auto;background:#171b22;border:1px solid #394150;border-radius:14px;padding:26px}input,button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:9px;border:1px solid #394150;background:#0e1116;color:#fff}button{background:#2563eb;cursor:pointer}.muted{color:#9aa5b1}</style></head><body><div class="box"><h2>首次使用：创建 WebUI 账户</h2><p class="muted">WebUI 使用用户名和密码；MCP / 快捷指令会使用另一把独立 API Key，进入系统后可在「设置」中复制。</p><input id="u" placeholder="用户名（至少 3 个字符）"><input id="p" type="password" placeholder="密码（至少 8 个字符）"><button onclick="setup()">创建账户</button><p id="m"></p></div><script>async function setup(){let r=await fetch('/api/auth/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(!r.ok){m.textContent=await r.text();return}m.textContent='创建成功，即将进入登录';setTimeout(()=>location.href='/',500)}</script></body></html>
